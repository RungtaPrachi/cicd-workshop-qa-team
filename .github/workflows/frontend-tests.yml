name: Frontend tests

on:
  push:
    branches: team4-prachi

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: ./frontend
      run: npm install

    - name: Run all tests with coverage
      working-directory: ./frontend
      run: npm test

  

